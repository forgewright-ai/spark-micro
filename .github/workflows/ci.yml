# spark-micro CI: the plugin inside a real micro, in a pty, against a stub
# spark -- on Ubuntu, Arch, Void, Fedora, openSUSE and macOS. Plus the privacy patterns and ASCII docs.
name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: privacy gate over the whole tree
        # the personal word list is a repository secret (one word per line);
        # each word escaped for grep -E, and -l everywhere: a hit names the
        # file, never the line -- this log is public. A fork without the
        # secret gets a NOTICE and the generic patterns only. Each check is
        # an if/exit 1: a negated pipeline (`! git grep ...`) is exempt from
        # errexit, so only the last one would decide the step.
        env:
          SPARK_PRIVACY_TERMS_SECRET: ${{ secrets.SPARK_PRIVACY_TERMS }}
        run: |
          printf '%s\n' "$SPARK_PRIVACY_TERMS_SECRET" > "$RUNNER_TEMP/privacy-terms"
          terms=$(cat .privacy-terms "$RUNNER_TEMP/privacy-terms" | grep -v '^#' | grep -v '^[[:space:]]*$' | sort -u | sed 's,[][\.*^$+?(){}|/],\\&,g' | paste -sd'|' -)
          if [ -z "$terms" ]; then echo "NOTICE: no privacy word list -- generic patterns only"; else
            if git grep -l -i -w -E "$terms" -- . ':(exclude).privacy-terms'; then
              echo "privacy: a listed word is in the tree"; exit 1; fi; fi
          hits=$(git grep -n -E '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' -- . | grep -v 'you@example.com' | cut -d: -f1 | sort -u || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"; echo "privacy: an e-mail address is in the tree"; exit 1; fi
          if git grep -l -E '\b(10\.[0-9]+\.[0-9]+\.[0-9]+|192\.168\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+)\b' -- .; then
            echo "privacy: a private IPv4 is in the tree"; exit 1; fi
          if git grep -l -E '(^.|[^[:alnum:]/._-])/(home|Users)/[A-Za-z0-9_-]+' -- .; then
            echo "privacy: a home path naming a user is in the tree"; exit 1; fi
      - name: ascii docs
        run: |
          tab=$(printf '\t')
          for f in README.md CHANGELOG.md CHEATSHEET.md CREDITS.md LICENSE help/spark.md repo.json; do
            if LC_ALL=C grep -n "[^ -~${tab}]" "$f"; then
              echo "non-ASCII in $f"; exit 1; fi; done
      - name: micro
        run: sudo apt-get install -y -qq micro >/dev/null && micro -version
      - name: the plugin in a pty
        run: python3 tests/micro_pty.py
  arch:
    # the same pty test where micro comes from pacman. The privacy and
    # ascii gates ran once, on linux.
    runs-on: ubuntu-latest
    container: archlinux:latest   # zizmor: ignore[unpinned-images] a rolling distro: latest is the only Arch there is, and -Syu moves it to today anyway
    timeout-minutes: 10
    steps:
      - run: pacman -Syu --noconfirm --needed git >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: micro
        run: pacman -S --noconfirm --needed micro python >/dev/null && micro -version
      - name: the plugin in a pty
        run: python3 tests/micro_pty.py
  void:
    # the same pty test where micro comes from xbps. xbps itself first (a
    # rolling distro refuses every install while xbps is behind), bash for
    # the runner's shell and libstdc++ for its node.
    runs-on: ubuntu-latest
    container: ghcr.io/void-linux/void-glibc-full:latest   # zizmor: ignore[unpinned-images] a rolling distro: latest is the only Void there is, and -Su moves it to today anyway
    timeout-minutes: 10
    steps:
      - run: xbps-install -Syu xbps >/dev/null 2>&1 || true; xbps-install -Syu >/dev/null; xbps-install -Sy git bash libstdc++ >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: micro
        run: xbps-install -Sy micro python3 >/dev/null && micro -version
      - name: the plugin in a pty
        run: python3 tests/micro_pty.py
  fedora:
    # the same pty test where micro comes from dnf. A stable release: the
    # image is pinned to its number, and the bare image has no python.
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 10
    steps:
      - run: dnf install -y git >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: micro
        run: dnf install -y micro python3 >/dev/null && micro -version
      - name: the plugin in a pty
        run: python3 tests/micro_pty.py
  opensuse:
    # the same pty test where micro comes from zypper, on Tumbleweed. dup
    # first (a rolling distro moves as one snapshot); the bare image has
    # no python.
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest   # zizmor: ignore[unpinned-images] a rolling distro: latest is the only Tumbleweed there is, and dup moves it to today anyway
    timeout-minutes: 10
    steps:
      - run: zypper --non-interactive dup --no-recommends >/dev/null; zypper --non-interactive install --no-recommends git >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: micro
        run: zypper --non-interactive install --no-recommends micro-editor python3 >/dev/null && micro -version
      - name: the plugin in a pty
        run: python3 tests/micro_pty.py
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: micro
        run: brew install micro >/dev/null && micro -version
      - name: the plugin in a pty (Apple's python 3.9)
        run: /usr/bin/python3 tests/micro_pty.py
